[project]
name = "ingly_laser"
authors = [{ name = "Ingly Design", email = "inglydesign@gmail.com" }]
description = "Costeggio per lavorazione (laser/UV/3D) e pricing KB INGLY sulla Quotation ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"
